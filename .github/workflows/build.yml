name: Build JoeQuake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cmake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.0.0"
          ninjaVersion: "^1.0.0"

      - name: Set up dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt update && sudo apt install -y \
            libminizip-dev libssl-dev zlib1g-dev \
            libsdl2-dev libmad0-dev libpng-dev libjpeg-turbo8-dev libvorbis-dev

      - name: Build
        shell: bash
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/latest/linuxdeploy-$(uname -m).AppImage -O linuxdeploy.AppImage
          chmod a+x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appdir ./build/AppDir
          cmake --preset Ninja -DENABLE_VCPKG=OFF
          cmake --build --preset RelWithDbgInfo
          cmake --install build

      - name: Build AppImage
        shell: bash
        run: |
          ./linuxdeploy.AppImage --appdir build/AppDir -d "$GITHUB_WORKSPACE"/dist/linux/io.github.j0zzz.joequake.desktop  -e "$GITHUB_WORKSPACE"/build/bin/joequake-gl -i "$GITHUB_WORKSPACE"/dist/linux/io.github.j0zzz.joequake.png --output appimage

      - name: Store AppImage
        uses: actions/upload-artifact@v4
        with:
          name: joequake-appimage
          path: "*.AppImage"

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cmake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.0.0"
          ninjaVersion: "^1.0.0"

      - name: Build
        shell: bash
        run: |
          cmake -G "Visual Studio 17 2022" -A Win32 -DENABLE_VCPKG=ON -B "build32"
          cmake --build build32 --config RelWithDbgInfo
