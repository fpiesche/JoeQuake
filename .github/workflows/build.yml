name: Build JoeQuake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cmake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.0.0"
          ninjaVersion: "^1.0.0"

      - name: Set up dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt install -y \
            libminizip-dev libssl-dev zlib1g-dev \
            libsdl2-dev libmad0-dev libpng-dev libjpeg-turbo8-dev libvorbis-dev

      - name: Build
        shell: bash
        run: |
          cmake --preset Ninja -DENABLE_VCPKG=OFF --install-prefix=$(pwd)/AppDir
          cmake --build --preset RelWithDbgInfo
          cmake --install build --prefix=./AppDir

      # - name: Create AppImage
      #   uses: AppImageCrafters/build-appimage@master
      #   with:
      #     recipe: dist/linux/AppImageBuilder.yml
      #   env:
      #     UPDATE_INFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.repository }}|latest|*.AppImage.zsync

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cmake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.0.0"
          ninjaVersion: "^1.0.0"

      - name: Build
        env:
          VCPKG_DEFAULT_TRIPLET: x86-windows
        shell: bash
        run: |
          echo VCPKG default triplet: ${VCPKG_DEFAULT_TRIPLET}
          cmake -G "Visual Studio 17 2022" -A Win32 -DENABLE_VCPKG=ON -DVCPKG_TARGET_ARCHITECTURE=x86 -B "build32"
          cmake --build build32 --config RelWithDbgInfo
