name: Build JoeQuake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          # - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install required packages
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt install -y \
              ninja-build \
              libminizip-dev libssl-dev zlib1g-dev \
              libsdl2-dev libmad0-dev libpng-dev libjpeg-turbo8-dev libvorbis-dev
          fi

      - name: Set vcpkg option
        shell: bash
        run: |
          if [[ "${{ matrix.runner }}" != "ubuntu"* ]]; then
            echo "ENABLE_VCPKG=ON" >> $GITHUB_ENV
          else
            echo "ENABLE_VCPKG=OFF" >> $GITHUB_ENV
          fi

      - name: Build
        shell: bash
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DENABLE_VCPKG=${{ env.ENABLE_VCPKG }}
          ninja
