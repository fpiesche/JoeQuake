name: Build JoeQuake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          # - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install required packages
        run: >
          apt install -y
          ninja-build
          libsdl2-dev libminizip-dev libssl-dev zlib1g-dev
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          ninja
