version: 1
AppDir:
  runtime:
    arch:
      - "{{ TARGET_ARCH }}"
    version: continuous
  app_info:
    id: io.github.j0zzz.joequake
    name: JoeQuake
    icon: io.github.j0zzz.joequake
    version: 0.17.9
    exec: bin/joequake-gl
    exec_args: $@

  apt:
    arch: []
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ bionic main restricted
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ bionic-updates main restricted
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ bionic universe
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ bionic-updates universe
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ bionic multiverse
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ bionic-updates multiverse
      - sourceline:
          deb http://archive.ubuntu.com/ubuntu/ bionic-backports main restricted
          universe multiverse
      - sourceline: deb http://security.ubuntu.com/ubuntu/ bionic-security main restricted
      - sourceline: deb http://security.ubuntu.com/ubuntu/ bionic-security universe
      - sourceline: deb http://security.ubuntu.com/ubuntu/ bionic-security multiverse
    include:
      - libminizip
      - libssl
      - zlib1g
      - libsdl2
      - libmad0
      - libpng
      - libjpeg-turbo8
      - libvorbis
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

AppImage:
  arch: "{{TARGET_ARCH}}"
  file_name: "io.github.j0zzz.joequake-{{APP_VERSION}}_{{TIMESTAMP}}-{{TARGET_ARCH}}.AppImage"
  update-information: "gh-releases-zsync|j0zzz|joequake-1|latest|*AppImage.zsync"

script:
  - cd "$BUILD_DIR"
  - git clone https://github.com/fpiesche/JoeQuake
  - cd JoeQuake
  - apt install -y libminizip-dev libssl-dev zlib1g-dev libsdl2-dev libmad0-dev libpng-dev libjpeg-turbo8-dev libvorbis-dev
  - cmake --preset Ninja -DENABLE_VCPKG=OFF --install-prefix=$(pwd)/build/AppDir
  - cmake --build --preset RelWithDbgInfo
  - cmake --install build --prefix=./build/AppDir
